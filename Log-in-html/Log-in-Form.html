<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mica Spot - Log in</title>
            <link rel="stylesheet" href="style.css">
        </head>

        <body>
            <div class="frame">
                <header class="bar">
                    <img src="../Assets/mica-spots_logo.jpg" 
                    alt="Mica Spots Logo"
                    class="logo">
                </header>

                <main>
                    <div class="main-container">                  
                        <h1>
                            Mica Spot
                        </h1>

                        <input type="radio" 
                        name="account" 
                        id="user"
                        checked
                        >

                        <input type="radio"
                        name="account"
                        id="owner"
                        >

                        <div class="tabs">
                            <label for="user">User</label>
                            <label for="owner">Owner</label>
                        </div>

                        <!--wala pa action papuntang home page-->
                        <form class="form form-user" action="" method="get">
                            <h2>
                                User Log in
                            </h2>

                            <label>
                                <input type="text"
                                name="username"
                                required
                                placeholder="Enter your username"
                                >
                            </label>

                            <label>
                                <input type="password"
                                name="password"
                                required
                                placeholder="Enter your password"
                                >
                            </label>

                            <button type="submit" class="small-button">Log in</button>
                            <p class="ask">No account yet? <a class="smol-button" href="Sign-up-Form.html">
                            Sign up</a></p>
                        </form>

                        <!--wala pa action papuntang home page-->
                        <form class="form form-owner" action="" method="get">
                            <h2>
                                Owner Log in
                            </h2>

                            <label>
                                <input type="text"
                                name="username"
                                required
                                placeholder="Enter your username"
                                >
                            </label>

                            <label>
                                <input type="password"
                                name="password"
                                required
                                placeholder="Enter your password"
                                >
                            </label>

                            <button type="submit" class="small-button">Log in</button>
                            <p class="ask">No account yet? <a class="smol-button" href="Sign-up-Form.html">
                            Sign up</a></p>
                        </form>
                    </div>
                </main>
            </div>

            <footer>
                
            </footer>
        </body>
    </html>
