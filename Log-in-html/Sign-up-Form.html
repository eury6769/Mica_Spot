<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mica Spot - Sign up</title>
            <link rel="stylesheet" href="style.css">
        </head>

        <body>
            <div class="frame">
                <header class="bar">
                    <img src="../Assets/mica-spots_logo.jpg" 
                    alt="Mica Spots Logo"
                    class="logo">
                </header>

                <main>
                    <div class="main-container">
                        <h1>
                            Mica Spot
                        </h1>

                        <input type="radio" 
                        name="account" 
                        id="user"
                        checked
                        >

                        <input type="radio"
                        name="account"
                        id="owner"
                        >

                        <div class="tabs">
                            <label for="user">User</label>
                            <label for="owner">Owner</label>
                        </div>

                        <!--wala pa action papuntang home page-->
                        <form class="form form-user" action="" method="get">
                            <h2>
                                User Details
                            </h2>

                            <label for="username">
                                <input type="text"
                                name="username"
                                required
                                placeholder="Enter your username"
                                >
                            </label>

                            <label for="password">
                                <input type="password"
                                name="password"
                                required
                                placeholder="Enter your password"
                                >
                            </label>

                            <label for="gmail">
                                <input type="email"
                                name="gmail"
                                required
                                placeholder="Enter your gmail"
                                >
                            </label>

                            <label for="num">
                                <input type="tel"
                                name="num"
                                required
                                placeholder="Enter your contact number"
                                >
                            </label>

                            <button type="submit" class="small-button">Sign up</button>
                            <p class="ask">Already have an account?<a class="smol-button" href="Log-in-Form.html">
                             Back to Login</a></p>
                        </form>

                        <!--wala pa action papuntang home page-->
                        <form class="form form-owner" action="" method="get">
                            <h2>
                                Owner Details
                            </h2>

                            <label for="username">
                                <input type="text"
                                name="username"
                                required
                                placeholder="Enter your username"
                                >
                            </label>

                            <label for="password">
                                <input type="password"
                                name="password"
                                required
                                placeholder="Enter your password"
                                >
                            </label>

                            <label for="gmail">
                                <input type="email"
                                name="gmail"
                                required
                                placeholder="Enter your gmail"
                                >
                            </label>

                            <label for="num">
                                <input type="tel"
                                name="num"
                                required
                                placeholder="Enter your contact number"
                                >
                            </label>

                            <label for="business">
                                <input type="text"
                                name="business"
                                required
                                placeholder="Enter your business name"
                                >
                            </label>

                            <button type="submit" class="small-button">Sign up</button>
                            <p class="ask">Already have an account?<a class="smol-button" href="Log-in-Form.html">
                             Back to Login</a></p>
                        </form>
                    </div>
                </main>
            </div>

            <footer>

            </footer>
        </body>
    </html>
