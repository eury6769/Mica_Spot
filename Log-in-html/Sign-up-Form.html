<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mica Spot - Sign up</title>
            <link rel="stylesheet" href="style.css">
        </head>

        <body>
            <main>
                <div class="main-container">
                    <section>
                        <h1>
                            Mica Spot
                        </h1>

                        <div class="tabs">
                            <label for="user">User</label>
                            <label for="owner">Owner</label>
                        </div>

                        <input type="radio" 
                        name="account" 
                        id="user"
                        checked
                        >

                        <input type="radio"
                        name="account"
                        id="owner"
                        >
                    </section>

                    <!--wala pa action papuntang home page-->
                    <form class="form form-user" action="" method="get">
                        <section>
                            <h2>
                                User Details
                            </h2>

                            <label for="username">Username
                                <input type="text"
                                name="username"
                                required
                                >
                            </label>

                            <label for="password">Password
                                <input type="password"
                                name="password"
                                required
                                >
                            </label>

                            <label for="gmail">Gmail
                                <input type="email"
                                name="gmail"
                                required
                                >
                            </label>

                            <label for="num">Contact Number
                                <input type="tel"
                                name="num"
                                required
                                >
                            </label>

                            <button type="submit" class="small-button">Sign up</button>

                            <p class="ask">Already have an account?</p>
                            <a class="smol-button" href="Log-in-Form.html">Back to Login</a>
                        </section>
                    </form>

                    <!--wala pa action papuntang home page-->
                    <form class="form form-owner" action="" method="get">
                        <section>
                            <h2>
                                Owner Details
                            </h2>

                            <label for="username">Username
                                <input type="text"
                                name="username"
                                required
                                >
                            </label>

                            <label for="password">Password
                                <input type="password"
                                name="password"
                                required
                                >
                            </label>

                            <label for="gmail">Gmail
                                <input type="email"
                                name="gmail"
                                required
                                >
                            </label>

                            <label for="num">Contact Number
                                <input type="tel"
                                name="num"
                                required
                                >
                            </label>

                            <label for="business">Business Name
                                <input type="text"
                                name="business"
                                required
                                >
                            </label>

                            <button type="submit" class="small-button">Sign up</button>

                            <p class="ask">Already have an account?</p>
                            <a class="smol-button" href="Log-in-Form.html">Back to Login</a>
                        </section>
                    </form>
                </div>
            </main>

            <footer>

            </footer>
        </body>
    </html>
