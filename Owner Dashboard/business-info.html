<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mica Spot | My Account</title>
        <link rel="stylesheet" href="../style.css">
    </head>
    
    <body class="web">
        <header class="navbar">
            <a href="../Owner Homepage/owner-homepage.html" class="logo">
                <img src="../Assets/mica-spot-logo.png" 
                alt="Mica Spot Logo"
                >
            </a>

            <nav class="nav-links">
                <a href="../Owner Homepage/owner-homepage.html">Home</a>
                <a href="../Owner Homepage/owner-about.html">About</a>
            </nav>

                <a class="settings" 
                href="./owner-dashboard.html" 
                aria-label="My Account"></a>
        </header>

        <div class="dash-layout">
            <aside class="dash-sidebar">
                <a class="button" href="./owner-dashboard.html">Dashboard</a>
                <a class="button" href="./manage-products.html">Manage Products</a>
                <a class="lgt-button" href="./business-info.html" aria-current="page">Business Information</a>
                <a class="lgt-button" href="./verification.html" >Verification</a>
                <a class="lgt-button" href="../index.html">Log Out</a>
            </aside>

            <main class="info-main">
                <section class="info-container">
                    <h1>Business Infomation</h1>

                    <form class="info-form" id="info">

                        <div class="field">
                            <div class="left-column">
                                <div class="group">
                                    <label for="name">Business Name</label>
                                    <input type="text" 
                                    id="name" 
                                    name="name"
                                    placeholder="Business Name"
                                    >
                                </div>

                                <div class="group">
                                    <label for="adr">Address</label>
                                    <input type="text"
                                    id="adr"
                                    name="adr"
                                    placeholder="Address"
                                    >
                                </div>

                                <div class="group">
                                    <label for="gmail">Opening Hours</label>
                                    <input type="email"
                                    id="gmail"
                                    name="gmail"
                                    placeholder="Opening Hours"
                                    >
                                </div>
                            </div>

                            <div class="right-column">
                                <div class="group">
                                    <label for="user">Username</label>
                                    <input type="text"
                                    id="user"
                                    name="user"
                                    placeholder="Username"
                                    >
                                </div>  
                                
                                <div class="group">
                                    <label for="pass">Password</label>
                                    <input type="password"
                                    id="pass"
                                    name="pass"
                                    placeholder="Password"
                                    >
                                </div>

                                <div class="form-group">
                                     <label class="form-label">Location</label>
                                     <a href="#" class="btn-maps" >Open in Google Maps</a>
                                </div>          

                                <div class="actions">
                                    <button type="button" class="edit-btn">
                                        Edit
                                    </button>

                                    <button type="button" class="save-btn">
                                        Save Changes
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </section>
            </main>
        </div>

        <footer>
            <div class="footer-brand">
                <img src="../Assets/mica-spot-name.png" 
                alt="Mica Spot"
                >
                <p>Discover your one-stop spot here at binan! A website that will help you explore the delicious meals our local spots can offer.</p>
            </div>

            <div class="contact">
                Contact Us
                <div class="contact-icons">
                    <a href="#" aria-label="Facebook">f</a>
                    <a href="#" aria-label="Phone">&#9742;</a>
                    <a href="#" aria-label="Email address">@</a>
                    <a href="#" aria-label="Message">&#9993;</a>
                </div>
            </div>
        </footer>
    </body>
</html>
