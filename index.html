<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mica Spot | Log-in</title>
        <link rel="stylesheet" href="./CSS/style.css">
    </head>

    <body>
        <main class="bg">
            <section class="brand">
                <img src="./Assets/mica-spot-logo.png" alt="mica-spot-logo">
                <div class="logo-tagline">Your One-Stop 
                    <br>Spot
                </div>
            </section>

            <div class="outer-layer">
                <div class="inner-layer">

                    <input type="radio" id="owner" name="account">
                    <input type="radio" id="user" name="account" checked>

                    <div class="tabs">
                        <label for="user">User</label>
                        <label for="owner">Owner</label>
                    </div>


                    <form class="user-form" action="./User Homepage/user-homepage.html" method="get">
                        <h1>User Log in</h1>

                        <div class="form">
                            <input type="text" 
                            name="username" 
                            placeholder="Username"
                            required
                            >
                        </div>

                        <div class="form">
                            <input type="password" 
                            name="password" 
                            placeholder="Password"
                            required
                            >
                        </div>

                        <label class="remember">
                            <input type="checkbox"
                            name="remember">
                            Remember me
                        </label>
                        
                        <button class="button">Log in</button>
                    </form>

                    <form class="owner-form" action="./Owner Homepage/owner-homepage.html" method="get">
                        <h1>Owner Log in</h1>

                        <div class="form">
                            <input type="text" 
                            name="username" 
                            placeholder="Username"
                            required
                            >
                        </div>

                        <div class="form">
                            <input type="password" 
                            name="password" 
                            placeholder="Password"
                            required
                            >
                        </div>

                        <label class="remember">
                            <input type="checkbox"
                            name="remember">
                            Remember me
                        </label>
                        
                        <button class="button">Log in</button>
                    </form>


                    <a class="link" href="#">Forgot Password?</a>
                    <div class="or">---------------- or ----------------</div>
                    <a class="lgt-button" href="./signup.html">Create an account</a>
                </div>
            </div>
        </main>
    </body>
</html>
