<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mica Spot | Sign-up</title>
        <link rel="stylesheet" href="/CSS/style.css">
    </head>

    <body>
        <main class="bg">
            <section class="brand">
                <img src="/Assets/mica-spot-logo.png" alt="mica-spot-logo">
                <div class="logo-tagline">Your One-Stop 
                    <br>Spot
                </div>
            </section>

            <div class="outer-layer">
                <div class="inner-layer">

                    <input type="radio" id="owner" name="account">
                    <input type="radio" id="user" name="account" checked>

                    <div class="tabs">
                        <label for="user">User</label>
                        <label for="owner">Owner</label>
                    </div>


                    <form class="user-form" action="/Login-Signup/login.html" method="get">
                        <h1>User Sign up</h1>

                        <div class="form">
                            <input type="text" 
                            name="username" 
                            placeholder="Username"
                            required
                            >
                        </div>

                        <div class="form">
                            <input type="password" 
                            name="password" 
                            placeholder="Password"
                            required
                            >
                        </div>

                        <div class="form">
                            <input type="email"
                            name="email"
                            placeholder="Email"
                            required
                            >
                        </div>

                        <div class="form">
                            <input type="tel"
                            name="num"
                            placeholder="Contact Number"
                            required
                            >
                        </div>
                        
                        <button class="button">Sign up</button>
                    </form>

                    <form class="owner-form" action="/Login-Signup/login.html" method="get">
                        <h1>Owner Sign up</h1>

                        <div class="form">
                            <input type="text" 
                            name="username" 
                            placeholder="Username"
                            required
                            >
                        </div>

                        <div class="form">
                            <input type="password" 
                            name="password" 
                            placeholder="Password"
                            required
                            >
                        </div>

                        <div class="form">
                            <input type="email"
                            name="email"
                            placeholder="Email"
                            required
                            >
                        </div>

                        <div class="form">
                            <input type="tel"
                            name="num"
                            placeholder="Contact Number"
                            required
                            >
                        </div>
            
                        <button class="button">Sign up</button>
                    </form>

                    <p class="ask">Already have an account?<a class="lnk" href="login.html">
                    Back to Log in
                    </a></p>
                </div>
            </div>
        </main>
    </body>
</html>
