<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mica Spot | My Account</title>
        <link rel="stylesheet" href="../style.css">
    </head>
    
    <body class="web">
        <header class="navbar">
            <a href="../User Homepage/user-homepage.html" class="logo">
                <img src="../Assets/mica-spot-logo.png" 
                alt="Mica Spot Logo"
                >
            </a>

            <nav class="nav-links">
                <a href="../User Homepage/user-homepage.html">Home</a>
                <a href="../User Homepage/user-about.html">About</a>
            </nav>

                <a class="settings" 
                href="./user-dashboard.html" 
                aria-label="My Account"></a>
        </header>

        <div class="dash-layout">
            <aside class="dash-sidebar">
                <a class="button" href="./user-dashboard.html">My Account</a>
                <a class="lgt-button" href="./account-info.html" aria-current="page">Account Information</a>
                <a class="lgt-button" href="../index.html">Log Out</a>
            </aside>

            <main class="info-main">
                <section class="info-container">
                    <h1>Account Infomation</h1>

                    <form class="info-form" id="info">

                        <div class="field">
                            <div class="left-column">
                                <div class="group">
                                    <label for="name">Username</label>
                                    <input type="text" 
                                    id="name" 
                                    name="name"
                                    placeholder="Username"
                                    >
                                </div>

                                <div class="group">
                                    <label for="pass">Password</label>
                                    <input type="password"
                                    id="pass"
                                    name="pass"
                                    placeholder="Password"
                                    >
                                </div>

                                <div class="group">
                                    <label for="gmail">Email</label>
                                    <input type="email"
                                    id="gmail"
                                    name="gmail"
                                    placeholder="Email"
                                    >
                                </div>
                            </div>

                            <div class="right-column">
                                <div class="group">
                                    <label for="num">Contact Number</label>
                                    <input type="tel"
                                    id="num"
                                    name="num"
                                    placeholder="Contact Number"
                                    >
                                </div>

                                <div class="action">
                                    <button type="button" class="edit-btn">
                                        Edit
                                    </button>

                                    <button type="button" class="save-btn">
                                        Save Changes
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </section>
            </main>
        </div>

        <footer>
            <div class="footer-brand">
                <img src="../Assets/mica-spot-name.png" 
                alt="Mica Spot"
                >
                <p>Discover your one-stop spot here at binan! A website that will help you explore the delicious meals our local spots can offer.</p>
            </div>

            <div class="contact">
                Contact Us
                <div class="contact-icons">
                    <a href="#" aria-label="Facebook">f</a>
                    <a href="#" aria-label="Phone">&#9742;</a>
                    <a href="#" aria-label="Email address">@</a>
                    <a href="#" aria-label="Message">&#9993;</a>
                </div>
            </div>
        </footer>
    </body>
</html>
